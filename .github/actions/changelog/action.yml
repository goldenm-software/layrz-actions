name: 'Generate Changelog'
description: 'Generate and optionally post changelog comments for PRs or releases'
author: 'Layrz'

inputs:
  exclude-dependabot:
    description: 'Skip action for dependabot PRs'
    required: false
    default: 'true'
  exclude-types:
    description: 'Commit types to exclude from changelog (comma-separated)'
    required: false
    default: ''
  comment-header:
    description: 'Header text for the PR comment'
    required: false
    default: '## 📋 Changelog Summary'
  from-ref:
    description: 'Starting reference (commit/tag) for changelog. If empty, auto-detects based on event type'
    required: false
    default: ''
  to-ref:
    description: 'Ending reference (commit/tag) for changelog. If empty, auto-detects based on event type'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for posting comments (only needed if posting to PR)'
    required: false
    default: ''
  post-comment:
    description: 'Whether to post comment to PR (requires github-token)'
    required: false
    default: 'true'

outputs:
  changelog:
    description: 'Generated changelog text'
    value: ${{ steps.run.outputs.changelog }}

runs:
  using: 'composite'
  steps:
    - name: Select binary
      id: bin
      shell: bash
      run: |
        OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        ARCH=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        # GitHub calls it X64/ARM64; normalize to amd64/arm64
        [ "$ARCH" = "x64" ] && ARCH="amd64"
        echo "path=$GITHUB_ACTION_PATH/bin/changelog-${OS}-${ARCH}" >> $GITHUB_OUTPUT

    - name: Run changelog
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_ACTOR: ${{ github.actor }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        FROM_REF: ${{ inputs.from-ref }}
        TO_REF: ${{ inputs.to-ref }}
        IS_PR: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        EXCLUDE_DEPENDABOT: ${{ inputs.exclude-dependabot }}
        EXCLUDE_TYPES: ${{ inputs.exclude-types }}
        COMMENT_HEADER: ${{ inputs.comment-header }}
        POST_COMMENT: ${{ inputs.post-comment }}
      run: |
        chmod +x "${{ steps.bin.outputs.path }}"
        "${{ steps.bin.outputs.path }}" > /tmp/changelog-output.txt
        {
          echo 'changelog<<CHANGELOG_EOF'
          cat /tmp/changelog-output.txt
          echo 'CHANGELOG_EOF'
        } >> $GITHUB_OUTPUT
