name: 'Go Checks'
description: 'Run Go linting and tests'
author: 'Layrz'

inputs:
  working-directory:
    description: 'Directory to run Go commands in'
    required: false
    default: '.'
  go-version:
    description: 'Go version to use'
    required: false
    default: '1.26.2'
  go-cache-dependency-path:
    description: 'Dependency path for Go cache'
    required: false
    default: 'go.sum'
  run-tests:
    description: 'Whether to run tests'
    required: false
    default: 'true'
  exclude-packages:
    description: 'Comma separated list of package path substrings to exclude from coverage (e.g. /cmd/,/examples)'
    required: false
    default: '/examples'
  upload-artifact:
    description: 'Whether to upload coverage artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for the coverage artifact'
    required: false
    default: 'go-coverage'

outputs:
  coverage-out-path:
    description: 'Path to the coverage.out file'
    value: ${{ steps.set-outputs.outputs.coverage-out-path }}
  coverage-summary-path:
    description: 'Path to the coverage-summary.txt file'
    value: ${{ steps.set-outputs.outputs.coverage-summary-path }}
  lcov-path:
    description: 'Path to the lcov.info file'
    value: ${{ steps.set-outputs.outputs.lcov-path }}
  test-results-path:
    description: 'Path to the test-results.json file'
    value: ${{ steps.set-outputs.outputs.test-results-path }}
  artifact-id:
    description: 'ID of the uploaded artifact'
    value: ${{ steps.upload-coverage.outputs.artifact-id }}
  artifact-url:
    description: 'URL of the uploaded artifact'
    value: ${{ steps.upload-coverage.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.go-cache-dependency-path }}

    - name: Ensure golangci-lint version file
      shell: bash
      run: |
        set -e

        WORKING_DIRECTORY="${{ inputs.working-directory }}"

        # Fallback golangci-lint version supplied when the consuming repo
        # doesn't pin its own via '.golangci-lint-version'. Bumping this
        # later (e.g. when golangci-lint v2.12 ships) is a one-line change.
        FALLBACK_GOLANGCI_LINT_VERSION="v2.11"

        VERSION_FILE_PATH="${WORKING_DIRECTORY}/.golangci-lint-version"
        if [ -f "$VERSION_FILE_PATH" ]; then
          echo "Using golangci-lint version pinned by the repo at '$VERSION_FILE_PATH'."
        else
          echo "$FALLBACK_GOLANGCI_LINT_VERSION" > "$VERSION_FILE_PATH"
          echo "No '$VERSION_FILE_PATH' found; using golangci-lint $FALLBACK_GOLANGCI_LINT_VERSION for this run."
        fi

    - name: Run linter
      uses: golangci/golangci-lint-action@v9
      with:
        working-directory: ${{ inputs.working-directory }}
        version-file: .golangci-lint-version

    - name: Run tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        EXCLUDE="${{ inputs.exclude-packages }}"
        if [ -n "$EXCLUDE" ]; then
          PKGS=$(go list ./... | tr ',' '\n')
          for pattern in $(echo "$EXCLUDE" | tr ',' ' '); do
            PKGS=$(echo "$PKGS" | grep -v "$pattern")
          done
          go test -v -json -coverprofile=coverage.out $PKGS > test-results.json
        else
          go test -v -json -coverprofile=coverage.out ./... > test-results.json
        fi
        go tool cover -func=coverage.out > coverage-summary.txt
        go install github.com/jandelgado/gcov2lcov@latest
        gcov2lcov -infile=coverage.out -outfile=lcov.info

    - name: Publish test results
      if: ${{ inputs.run-tests == 'true' }}
      uses: dorny/test-reporter@v3
      with:
        name: Unit Tests
        path: ${{ inputs.working-directory }}/test-results.json
        reporter: golang-json

    - name: Set outputs
      id: set-outputs
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        COVERAGE_OUT_PATH="${{ inputs.working-directory }}/coverage.out"
        COVERAGE_SUMMARY_PATH="${{ inputs.working-directory }}/coverage-summary.txt"
        LCOV_PATH="${{ inputs.working-directory }}/lcov.info"
        TEST_RESULTS_PATH="${{ inputs.working-directory }}/test-results.json"
        echo "coverage-out-path=$COVERAGE_OUT_PATH" >> $GITHUB_OUTPUT
        echo "coverage-summary-path=$COVERAGE_SUMMARY_PATH" >> $GITHUB_OUTPUT
        echo "lcov-path=$LCOV_PATH" >> $GITHUB_OUTPUT
        echo "test-results-path=$TEST_RESULTS_PATH" >> $GITHUB_OUTPUT

    - name: Upload coverage artifact
      id: upload-coverage
      if: ${{ inputs.run-tests == 'true' && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.working-directory }}/coverage.out
          ${{ inputs.working-directory }}/coverage-summary.txt
          ${{ inputs.working-directory }}/lcov.info
          ${{ inputs.working-directory }}/test-results.json
        retention-days: 1
