name: 'Go Checks'
description: 'Run Go linting and tests'
author: 'Layrz'

inputs:
  working-directory:
    description: 'Directory to run Go commands in'
    required: false
    default: '.'
  go-version:
    description: 'Go version to use'
    required: false
    default: '1.26.2'
  go-cache-dependency-path:
    description: 'Dependency path for Go cache'
    required: false
    default: 'go.sum'
  run-tests:
    description: 'Whether to run tests'
    required: false
    default: 'true'
  exclude-packages:
    description: 'Comma separated list of package path substrings to exclude from coverage (e.g. /cmd/,/examples)'
    required: false
    default: '/examples'
  upload-artifact:
    description: 'Whether to upload coverage artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for the coverage artifact'
    required: false
    default: 'go-coverage'

outputs:
  coverage-out-path:
    description: 'Path to the coverage.out file'
    value: ${{ steps.set-outputs.outputs.coverage-out-path }}
  coverage-summary-path:
    description: 'Path to the coverage-summary.txt file'
    value: ${{ steps.set-outputs.outputs.coverage-summary-path }}
  lcov-path:
    description: 'Path to the lcov.info file'
    value: ${{ steps.set-outputs.outputs.lcov-path }}
  test-results-path:
    description: 'Path to the test-results.json file'
    value: ${{ steps.set-outputs.outputs.test-results-path }}
  artifact-id:
    description: 'ID of the uploaded artifact'
    value: ${{ steps.upload-coverage.outputs.artifact-id }}
  artifact-url:
    description: 'URL of the uploaded artifact'
    value: ${{ steps.upload-coverage.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.go-cache-dependency-path }}

    - name: Ensure golangci-lint version file
      shell: bash
      run: |
        set -e

        WORKING_DIRECTORY="${{ inputs.working-directory }}"

        # Fallback golangci-lint version supplied when the consuming repo
        # doesn't pin its own via '.golangci-lint-version'. Bumping this
        # later (e.g. when golangci-lint v2.12 ships) is a one-line change.
        FALLBACK_GOLANGCI_LINT_VERSION="v2.11"

        VERSION_FILE_PATH="${WORKING_DIRECTORY}/.golangci-lint-version"
        if [ -f "$VERSION_FILE_PATH" ]; then
          echo "Using golangci-lint version pinned by the repo at '$VERSION_FILE_PATH'."
        else
          echo "$FALLBACK_GOLANGCI_LINT_VERSION" > "$VERSION_FILE_PATH"
          echo "No '$VERSION_FILE_PATH' found; using golangci-lint $FALLBACK_GOLANGCI_LINT_VERSION for this run."
        fi

        # Pre-flight guard: golangci-lint's own go.mod is pinned, by upstream
        # policy, to (latest Go minor - 1) — see
        # https://github.com/golangci/golangci-lint/blob/main/go.mod. No
        # golangci-lint release is ever built with the newest Go toolchain, so
        # a go.mod targeting that newest release will fail to lint no matter
        # which golangci-lint version is selected here. This is a diagnostic
        # only: it never fails the job, since the actual failure (if any)
        # will surface clearly from the "Run linter" step.
        GO_MOD_PATH="${WORKING_DIRECTORY}/go.mod"
        TARGET_GO_VERSION=""
        if [ -f "$GO_MOD_PATH" ]; then
          TARGET_GO_VERSION=$(grep -E '^go [0-9]+\.[0-9]+' "$GO_MOD_PATH" | head -n1 | awk '{print $2}')
          if [ -z "$TARGET_GO_VERSION" ]; then
            echo "::warning::Could not find a 'go' directive in $GO_MOD_PATH; skipping the golangci-lint compatibility pre-flight check."
          else
            echo "Consuming repo go.mod declares: go $TARGET_GO_VERSION"
          fi
        else
          echo "::warning::No go.mod found at $GO_MOD_PATH; skipping the golangci-lint compatibility pre-flight check."
        fi

        if [ -n "$TARGET_GO_VERSION" ]; then
          SUPPORTED_GO_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/golangci/golangci-lint/v2/go.mod" 2>/dev/null | grep -E '^go [0-9]+\.[0-9]+' | head -n1 | awk '{print $2}' || true)
          if [ -n "$SUPPORTED_GO_VERSION" ]; then
            echo "golangci-lint (v2 branch) currently supports up to: go $SUPPORTED_GO_VERSION"
            TARGET_MINOR=$(echo "$TARGET_GO_VERSION" | awk -F. '{print $1"."$2}')
            SUPPORTED_MINOR=$(echo "$SUPPORTED_GO_VERSION" | awk -F. '{print $1"."$2}')
            IS_NEWER=$(awk -v a="$TARGET_MINOR" -v b="$SUPPORTED_MINOR" 'BEGIN{split(a,x,".");split(b,y,".");if(x[1]>y[1]||(x[1]==y[1]&&x[2]>y[2]))print "1";else print "0"}')
            if [ "$IS_NEWER" = "1" ]; then
              echo "::warning::This repo's go.mod targets go $TARGET_GO_VERSION, newer than the go $SUPPORTED_GO_VERSION that golangci-lint currently supports. By upstream policy, golangci-lint always tracks (latest Go minor - 1), so no available golangci-lint release will lint against go $TARGET_GO_VERSION until golangci-lint catches up. The 'Run linter' step below will likely fail with 'can't load config: the Go language version ... is lower than the targeted Go version'. Fix: lower the 'go' directive in $GO_MOD_PATH to at most $SUPPORTED_GO_VERSION — this only sets the minimum language version your code requires, not the toolchain used to build it, so the newer Go toolchain set via the go-version input still builds and runs your code unchanged."
            fi
          else
            echo "::warning::Could not fetch golangci-lint's go.mod to run the compatibility pre-flight check (network issue or file moved); proceeding without it."
          fi
        fi

    - name: Run linter
      uses: golangci/golangci-lint-action@v9
      with:
        working-directory: ${{ inputs.working-directory }}
        version-file: ${{ inputs.working-directory }}/.golangci-lint-version

    - name: Run tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        EXCLUDE="${{ inputs.exclude-packages }}"
        if [ -n "$EXCLUDE" ]; then
          PKGS=$(go list ./... | tr ',' '\n')
          for pattern in $(echo "$EXCLUDE" | tr ',' ' '); do
            PKGS=$(echo "$PKGS" | grep -v "$pattern")
          done
          go test -v -json -coverprofile=coverage.out $PKGS > test-results.json
        else
          go test -v -json -coverprofile=coverage.out ./... > test-results.json
        fi
        go tool cover -func=coverage.out > coverage-summary.txt
        go install github.com/jandelgado/gcov2lcov@latest
        gcov2lcov -infile=coverage.out -outfile=lcov.info

    - name: Publish test results
      if: ${{ inputs.run-tests == 'true' }}
      uses: dorny/test-reporter@v3
      with:
        name: Unit Tests
        path: ${{ inputs.working-directory }}/test-results.json
        reporter: golang-json

    - name: Set outputs
      id: set-outputs
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        COVERAGE_OUT_PATH="${{ inputs.working-directory }}/coverage.out"
        COVERAGE_SUMMARY_PATH="${{ inputs.working-directory }}/coverage-summary.txt"
        LCOV_PATH="${{ inputs.working-directory }}/lcov.info"
        TEST_RESULTS_PATH="${{ inputs.working-directory }}/test-results.json"
        echo "coverage-out-path=$COVERAGE_OUT_PATH" >> $GITHUB_OUTPUT
        echo "coverage-summary-path=$COVERAGE_SUMMARY_PATH" >> $GITHUB_OUTPUT
        echo "lcov-path=$LCOV_PATH" >> $GITHUB_OUTPUT
        echo "test-results-path=$TEST_RESULTS_PATH" >> $GITHUB_OUTPUT

    - name: Upload coverage artifact
      id: upload-coverage
      if: ${{ inputs.run-tests == 'true' && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.working-directory }}/coverage.out
          ${{ inputs.working-directory }}/coverage-summary.txt
          ${{ inputs.working-directory }}/lcov.info
          ${{ inputs.working-directory }}/test-results.json
        retention-days: 1
