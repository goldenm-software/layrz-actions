name: 'Go Checks'
description: 'Run Go linting and tests'
author: 'Layrz'

inputs:
  working-directory:
    description: 'Directory to run Go commands in'
    required: false
    default: '.'
  go-version:
    description: 'Go version to use'
    required: false
    default: '1.26.2'
  go-cache-dependency-path:
    description: 'Dependency path for Go cache'
    required: false
    default: 'go.sum'
  golangci-lint-version:
    description: >-
      Version of golangci-lint to use. Default 'auto' resolves it via the
      following precedence (see the "Resolve golangci-lint version" step):
      1) an explicit value passed here always wins, honoured verbatim;
      2) otherwise, '<working-directory>/.golangci-lint-version' is used
      if present; 3) otherwise, '<working-directory>/.tool-versions' is
      used if present AND it contains a 'golangci-lint' entry; 4) otherwise
      falls back to the previously hardcoded default version. Pass an
      explicit version (e.g. 'v2.11.4') to pin it for reproducibility —
      an explicit value is always honoured verbatim and never overridden.
    required: false
    default: 'auto'
  run-tests:
    description: 'Whether to run tests'
    required: false
    default: 'true'
  exclude-packages:
    description: 'Comma separated list of package path substrings to exclude from coverage (e.g. /cmd/,/examples)'
    required: false
    default: '/examples'
  upload-artifact:
    description: 'Whether to upload coverage artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for the coverage artifact'
    required: false
    default: 'go-coverage'

outputs:
  coverage-out-path:
    description: 'Path to the coverage.out file'
    value: ${{ steps.set-outputs.outputs.coverage-out-path }}
  coverage-summary-path:
    description: 'Path to the coverage-summary.txt file'
    value: ${{ steps.set-outputs.outputs.coverage-summary-path }}
  lcov-path:
    description: 'Path to the lcov.info file'
    value: ${{ steps.set-outputs.outputs.lcov-path }}
  test-results-path:
    description: 'Path to the test-results.json file'
    value: ${{ steps.set-outputs.outputs.test-results-path }}
  artifact-id:
    description: 'ID of the uploaded artifact'
    value: ${{ steps.upload-coverage.outputs.artifact-id }}
  artifact-url:
    description: 'URL of the uploaded artifact'
    value: ${{ steps.upload-coverage.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.go-cache-dependency-path }}

    - name: Resolve golangci-lint version
      id: resolve-golangci-lint
      shell: bash
      run: |
        set -e

        EXPLICIT_VERSION="${{ inputs.golangci-lint-version }}"
        WORKING_DIRECTORY="${{ inputs.working-directory }}"

        # Historical default retained as the last-resort fallback when the
        # caller hasn't pinned a version AND the consuming repo has no
        # '.golangci-lint-version' / '.tool-versions' of its own. Bumping
        # this later (e.g. when golangci-lint v2.12 ships) is a one-line change.
        FALLBACK_GOLANGCI_LINT_VERSION="v2.11"

        # go.mod's `go` directive is a minimum-language-version floor, read here
        # purely for logging and for the pre-flight guard below — it never drives
        # which golangci-lint version we ask for.
        GO_MOD_PATH="${WORKING_DIRECTORY}/go.mod"
        TARGET_GO_VERSION=""
        if [ -f "$GO_MOD_PATH" ]; then
          TARGET_GO_VERSION=$(grep -E '^go [0-9]+\.[0-9]+' "$GO_MOD_PATH" | head -n1 | awk '{print $2}')
          if [ -z "$TARGET_GO_VERSION" ]; then
            echo "::warning::Could not find a 'go' directive in $GO_MOD_PATH; skipping the golangci-lint compatibility pre-flight check."
          else
            echo "Consuming repo go.mod declares: go $TARGET_GO_VERSION"
          fi
        else
          echo "::warning::No go.mod found at $GO_MOD_PATH; skipping the golangci-lint compatibility pre-flight check."
        fi

        # Resolution precedence (highest first):
        #   1. explicit `golangci-lint-version` input (anything but 'auto') — verbatim, never overridden
        #   2. '<working-directory>/.golangci-lint-version', if present
        #   3. '<working-directory>/.tool-versions', if present AND it has a golangci-lint entry
        #   4. the hardcoded $FALLBACK_GOLANGCI_LINT_VERSION
        #
        # golangci-lint-action@v9's `version` and `version-file` inputs are
        # mutually exclusive (it warns and ignores version-file if both are
        # non-empty). A composite action step can't conditionally omit an
        # input key, so this step always emits BOTH `version` and
        # `version-file` outputs with exactly one of them non-empty; the
        # "Run linter" step below passes both through unconditionally.
        RESOLVED_VERSION=""
        RESOLVED_VERSION_FILE=""

        if [ -n "$EXPLICIT_VERSION" ] && [ "$EXPLICIT_VERSION" != "auto" ]; then
          echo "golangci-lint-version was explicitly set to '$EXPLICIT_VERSION' — honouring it verbatim, no auto-resolution."
          RESOLVED_VERSION="$EXPLICIT_VERSION"
        else
          VERSION_FILE_PATH="${WORKING_DIRECTORY}/.golangci-lint-version"
          TOOL_VERSIONS_PATH="${WORKING_DIRECTORY}/.tool-versions"

          if [ -f "$VERSION_FILE_PATH" ]; then
            echo "golangci-lint-version is 'auto' — found '$VERSION_FILE_PATH' in the consuming repo, using it via version-file."
            RESOLVED_VERSION_FILE="$VERSION_FILE_PATH"
          elif [ -f "$TOOL_VERSIONS_PATH" ] && grep -qE '^golangci-lint[[:space:]]' "$TOOL_VERSIONS_PATH"; then
            echo "golangci-lint-version is 'auto' — no .golangci-lint-version, but found a golangci-lint entry in '$TOOL_VERSIONS_PATH', using it via version-file."
            RESOLVED_VERSION_FILE="$TOOL_VERSIONS_PATH"
          else
            echo "golangci-lint-version is 'auto' — no .golangci-lint-version or .tool-versions (with a golangci-lint entry) found in '$WORKING_DIRECTORY'; falling back to the hardcoded default '$FALLBACK_GOLANGCI_LINT_VERSION'."
            RESOLVED_VERSION="$FALLBACK_GOLANGCI_LINT_VERSION"
          fi
        fi

        # Pre-flight guard: golangci-lint's own go.mod is pinned, by upstream
        # policy, to (latest Go minor - 1) — see
        # https://github.com/golangci/golangci-lint/blob/main/go.mod. No
        # golangci-lint release is ever built with the newest Go toolchain, so
        # a go.mod targeting that newest release will fail to lint no matter
        # which golangci-lint version is selected here (auto or explicit).
        # This is a diagnostic only: it never fails the job, since the actual
        # failure (if any) will surface clearly from the "Run linter" step.
        if [ -n "$TARGET_GO_VERSION" ]; then
          SUPPORTED_GO_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/golangci/golangci-lint/v2/go.mod" 2>/dev/null | grep -E '^go [0-9]+\.[0-9]+' | head -n1 | awk '{print $2}' || true)
          if [ -n "$SUPPORTED_GO_VERSION" ]; then
            echo "golangci-lint (v2 branch) currently supports up to: go $SUPPORTED_GO_VERSION"
            TARGET_MINOR=$(echo "$TARGET_GO_VERSION" | awk -F. '{print $1"."$2}')
            SUPPORTED_MINOR=$(echo "$SUPPORTED_GO_VERSION" | awk -F. '{print $1"."$2}')
            IS_NEWER=$(awk -v a="$TARGET_MINOR" -v b="$SUPPORTED_MINOR" 'BEGIN{split(a,x,".");split(b,y,".");if(x[1]>y[1]||(x[1]==y[1]&&x[2]>y[2]))print "1";else print "0"}')
            if [ "$IS_NEWER" = "1" ]; then
              echo "::warning::This repo's go.mod targets go $TARGET_GO_VERSION, newer than the go $SUPPORTED_GO_VERSION that golangci-lint currently supports. By upstream policy, golangci-lint always tracks (latest Go minor - 1), so no available golangci-lint release (auto or pinned) will lint against go $TARGET_GO_VERSION until golangci-lint catches up. The 'Run linter' step below will likely fail with 'can't load config: the Go language version ... is lower than the targeted Go version'. Fix: lower the 'go' directive in $GO_MOD_PATH to at most $SUPPORTED_GO_VERSION — this only sets the minimum language version your code requires, not the toolchain used to build it, so the newer Go toolchain set via the go-version input still builds and runs your code unchanged."
            fi
          else
            echo "::warning::Could not fetch golangci-lint's go.mod to run the compatibility pre-flight check (network issue or file moved); proceeding without it."
          fi
        fi

        echo "Resolved golangci-lint version: '${RESOLVED_VERSION:-<none>}', version-file: '${RESOLVED_VERSION_FILE:-<none>}'"
        echo "version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"
        echo "version-file=$RESOLVED_VERSION_FILE" >> "$GITHUB_OUTPUT"

    - name: Run linter
      uses: golangci/golangci-lint-action@v9
      with:
        working-directory: ${{ inputs.working-directory }}
        version: ${{ steps.resolve-golangci-lint.outputs.version }}
        version-file: ${{ steps.resolve-golangci-lint.outputs.version-file }}

    - name: Run tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        EXCLUDE="${{ inputs.exclude-packages }}"
        if [ -n "$EXCLUDE" ]; then
          PKGS=$(go list ./... | tr ',' '\n')
          for pattern in $(echo "$EXCLUDE" | tr ',' ' '); do
            PKGS=$(echo "$PKGS" | grep -v "$pattern")
          done
          go test -v -json -coverprofile=coverage.out $PKGS > test-results.json
        else
          go test -v -json -coverprofile=coverage.out ./... > test-results.json
        fi
        go tool cover -func=coverage.out > coverage-summary.txt
        go install github.com/jandelgado/gcov2lcov@latest
        gcov2lcov -infile=coverage.out -outfile=lcov.info

    - name: Publish test results
      if: ${{ inputs.run-tests == 'true' }}
      uses: dorny/test-reporter@v3
      with:
        name: Unit Tests
        path: ${{ inputs.working-directory }}/test-results.json
        reporter: golang-json

    - name: Set outputs
      id: set-outputs
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        COVERAGE_OUT_PATH="${{ inputs.working-directory }}/coverage.out"
        COVERAGE_SUMMARY_PATH="${{ inputs.working-directory }}/coverage-summary.txt"
        LCOV_PATH="${{ inputs.working-directory }}/lcov.info"
        TEST_RESULTS_PATH="${{ inputs.working-directory }}/test-results.json"
        echo "coverage-out-path=$COVERAGE_OUT_PATH" >> $GITHUB_OUTPUT
        echo "coverage-summary-path=$COVERAGE_SUMMARY_PATH" >> $GITHUB_OUTPUT
        echo "lcov-path=$LCOV_PATH" >> $GITHUB_OUTPUT
        echo "test-results-path=$TEST_RESULTS_PATH" >> $GITHUB_OUTPUT

    - name: Upload coverage artifact
      id: upload-coverage
      if: ${{ inputs.run-tests == 'true' && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.working-directory }}/coverage.out
          ${{ inputs.working-directory }}/coverage-summary.txt
          ${{ inputs.working-directory }}/lcov.info
          ${{ inputs.working-directory }}/test-results.json
        retention-days: 1
