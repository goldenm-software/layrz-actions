name: 'Swift/iOS Checks'
description: 'Run SwiftLint linting and XCTest tests for iOS'
author: 'Layrz'

inputs:
  working-directory:
    description: 'Directory containing the iOS workspace (e.g., example/ios)'
    required: false
    default: 'example/ios'
  workspace:
    description: 'Name of the Xcode workspace'
    required: false
    default: 'Runner.xcworkspace'
  scheme:
    description: 'Xcode scheme to build and test'
    required: false
    default: 'Runner'
  destination:
    description: 'xcodebuild destination; "auto" picks the first available iPhone simulator on the runner'
    required: false
    default: 'auto'
  flutter-version:
    description: 'Flutter version to use; when non-empty, set up Flutter and run flutter build ios --config-only'
    required: false
    default: ''
  flutter-directory:
    description: 'Directory to run Flutter commands in'
    required: false
    default: '.'
  run-pod-install:
    description: 'Whether to run pod install (cocoapods is preinstalled on macOS)'
    required: false
    default: 'true'
  lint-directory:
    description: 'Directory path to lint with swiftlint (e.g., ios/layrz_push/Sources for hand-written code)'
    required: false
    default: '.'
  swiftlint-version:
    description: 'Version of SwiftLint to use (e.g., 0.57.0)'
    required: false
    default: '0.57.0'
  run-lint:
    description: 'Whether to run SwiftLint'
    required: false
    default: 'true'
  run-tests:
    description: 'Whether to run XCTest tests'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Whether to upload test results artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for the test results artifact'
    required: false
    default: 'swift-test-results'
  run-coverage:
    description: 'Whether to export coverage to lcov'
    required: false
    default: 'true'
  coverage-artifact-name:
    description: 'Name for the coverage artifact'
    required: false
    default: 'swift-coverage'
  coverage-include-pattern:
    description: 'Only source paths matching this substring are kept in the lcov output; empty keeps everything'
    required: false
    default: ''

outputs:
  test-results-path:
    description: 'Path to the junit test results XML file'
    value: ${{ steps.set-outputs.outputs.test-results-path }}
  coverage-path:
    description: 'Path to the lcov coverage file'
    value: ${{ steps.set-outputs.outputs.coverage-path }}
  artifact-id:
    description: 'ID of the uploaded artifact'
    value: ${{ steps.upload-artifact.outputs.artifact-id }}
  artifact-url:
    description: 'URL of the uploaded artifact'
    value: ${{ steps.upload-artifact.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Flutter
      if: ${{ inputs.flutter-version != '' }}
      uses: flutter-actions/setup-flutter@v4
      with:
        channel: stable
        version: ${{ inputs.flutter-version }}
        cache: true
        cache-sdk: true

    - name: Run flutter build ios --config-only
      if: ${{ inputs.flutter-version != '' }}
      shell: bash
      working-directory: ${{ inputs.flutter-directory }}
      run: flutter build ios --config-only --no-codesign --debug

    - name: Cache CocoaPods
      if: ${{ inputs.run-pod-install == 'true' }}
      uses: actions/cache@v6
      with:
        path: |
          ${{ inputs.working-directory }}/Pods
          ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-pods-${{ hashFiles(format('{0}/Podfile.lock', inputs.working-directory), format('{0}/Podfile', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Cache Swift packages
      if: ${{ inputs.run-tests == 'true' }}
      uses: actions/cache@v6
      with:
        path: |
          ${{ inputs.working-directory }}/build/SourcePackages
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles(format('{0}/**/Package.resolved', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Run pod install
      if: ${{ inputs.run-pod-install == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pod install

    - name: Download and install SwiftLint
      id: install-swiftlint
      if: ${{ inputs.run-lint == 'true' }}
      shell: bash
      run: |
        set -e

        SWIFTLINT_VERSION="${{ inputs.swiftlint-version }}"
        DOWNLOAD_URL="https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
        SWIFTLINT_BIN_DIR="$RUNNER_TEMP/swiftlint-bin"

        mkdir -p "$SWIFTLINT_BIN_DIR"

        echo "Downloading SwiftLint $SWIFTLINT_VERSION from $DOWNLOAD_URL"
        if ! curl -sL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/swiftlint.zip"; then
          echo "ERROR: Failed to download SwiftLint $SWIFTLINT_VERSION from GitHub releases"
          echo "Verify that version $SWIFTLINT_VERSION exists at: https://github.com/realm/SwiftLint/releases"
          exit 1
        fi

        unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$SWIFTLINT_BIN_DIR"
        chmod +x "$SWIFTLINT_BIN_DIR/swiftlint"

        echo "swiftlint-path=$SWIFTLINT_BIN_DIR/swiftlint" >> $GITHUB_OUTPUT

    - name: Run SwiftLint
      if: ${{ inputs.run-lint == 'true' }}
      shell: bash
      run: |
        SWIFTLINT_PATH="${{ steps.install-swiftlint.outputs.swiftlint-path }}"
        if [ -f ".swiftlint.yml" ]; then
          "$SWIFTLINT_PATH" lint --strict --force-exclude "${{ inputs.lint-directory }}"
        else
          cat > "$RUNNER_TEMP/swiftlint.yml" << 'SWIFTLINT_EOF'
        excluded:
          - "**/*.g.swift"
          - "**/Pods"
          - "**/.symlinks"
          - "**/.dart_tool"
        SWIFTLINT_EOF
          "$SWIFTLINT_PATH" lint --strict --force-exclude --config "$RUNNER_TEMP/swiftlint.yml" "${{ inputs.lint-directory }}"
        fi

    - name: Create build reports directory
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: mkdir -p build/reports/junit

    - name: Install xcpretty
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        if ! command -v xcpretty &> /dev/null; then
          sudo gem install xcpretty
        fi

    - name: Run XCTest tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -o pipefail

        # Resolve simulator destination if needed
        DESTINATION="${{ inputs.destination }}"
        if [ "$DESTINATION" = "auto" ]; then
          SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -n1 | xargs)
          if [ -z "$SIM_NAME" ]; then
            echo "ERROR: no available iPhone simulator found on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $SIM_NAME"
          DESTINATION="platform=iOS Simulator,name=$SIM_NAME"
        fi

        # No CODE_SIGNING_ALLOWED=NO: simulator tests ad-hoc sign by default, and an unsigned test host cannot access the keychain (SecItem* fails without the application-identifier entitlement)
        xcodebuild test \
          -workspace "${{ inputs.workspace }}" \
          -scheme "${{ inputs.scheme }}" \
          -destination "$DESTINATION" \
          -derivedDataPath build \
          -enableCodeCoverage YES | \
          xcpretty --report junit --output build/reports/junit/junit.xml

    - name: Export coverage to lcov
      id: export-coverage
      if: ${{ inputs.run-tests == 'true' && inputs.run-coverage == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Non-fatal coverage export: any failure prints a warning and exits cleanly
        {
          # Helper function to filter lcov by path pattern
          filter_lcov_by_pattern() {
            local pattern="$1"
            local input_file="$2"
            local output_file="$3"

            awk -v pattern="$pattern" '
              /^SF:/ {
                current_sf = $0
                if (index(current_sf, pattern) > 0) {
                  in_record = 1
                  print current_sf
                } else {
                  in_record = 0
                }
                next
              }
              /^end_of_record/ {
                if (in_record) print $0
                in_record = 0
                next
              }
              in_record { print $0 }
            ' "$input_file" > "$output_file"
          }

          # Helper to check if file is a Mach-O executable
          is_mach_o() {
            local file="$1"
            [ -f "$file" ] && file "$file" 2>/dev/null | grep -q "Mach-O"
          }

          # Find the profdata
          PROFDATA=$(find build/Build/ProfileData -name 'Coverage.profdata' | head -n1)
          if [ -z "$PROFDATA" ]; then
            echo "coverage export skipped: Coverage.profdata not found in build/Build/ProfileData — tests are unaffected"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Create reports directory if needed
          mkdir -p build/reports

          # Search for coverage candidates: prioritized order
          CANDIDATES=()

          # Candidate A: *.xctest executable inside test bundle
          for xctest_dir in build/Build/Products/*-iphonesimulator/*.xctest/PlugIns/*.xctest/; do
            if [ -d "$xctest_dir" ]; then
              xctest_name=$(basename "$xctest_dir" .xctest)
              xctest_bin="$xctest_dir$xctest_name"
              if is_mach_o "$xctest_bin"; then
                CANDIDATES+=("$xctest_bin")
              fi
            fi
          done

          # Candidate B: Framework executables
          for framework_dir in build/Build/Products/*-iphonesimulator/*.app/Frameworks/*.framework/; do
            if [ -d "$framework_dir" ]; then
              framework_name=$(basename "$framework_dir" .framework)
              framework_bin="$framework_dir$framework_name"
              if is_mach_o "$framework_bin"; then
                CANDIDATES+=("$framework_bin")
              fi
            fi
          done

          # Candidate C: App binary itself
          APP_BINARY=$(find build/Build/Products/*-iphonesimulator/"${{ inputs.scheme }}".app -name "${{ inputs.scheme }}" -type f 2>/dev/null | head -n1)
          if [ -z "$APP_BINARY" ]; then
            APP_BINARY=$(find build/Build/Products -name "*.app" -type d 2>/dev/null | head -n1)
            if [ -n "$APP_BINARY" ]; then
              APP_SCHEME=$(basename "$APP_BINARY" .app)
              APP_BINARY="$APP_BINARY/$APP_SCHEME"
            fi
          fi
          if is_mach_o "$APP_BINARY"; then
            CANDIDATES+=("$APP_BINARY")
          fi

          if [ ${#CANDIDATES[@]} -eq 0 ]; then
            echo "coverage export skipped: no Mach-O executables found in build/Build/Products/*-iphonesimulator/ — tests are unaffected"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Try combined export with all candidates (first as primary, rest as -object flags)
          PRIMARY_BIN="${CANDIDATES[0]}"
          TMP_LCOV="$RUNNER_TEMP/lcov.tmp"
          EXPORT_SUCCESS=false

          if [ ${#CANDIDATES[@]} -gt 1 ]; then
            OBJECT_FLAGS=""
            for ((i=1; i<${#CANDIDATES[@]}; i++)); do
              OBJECT_FLAGS="$OBJECT_FLAGS -object ${CANDIDATES[i]}"
            done

            if xcrun llvm-cov export -format=lcov -instr-profile "$PROFDATA" $OBJECT_FLAGS "$PRIMARY_BIN" > "$TMP_LCOV" 2>/dev/null && [ -s "$TMP_LCOV" ] && grep -q "^SF:" "$TMP_LCOV"; then
              mv "$TMP_LCOV" build/reports/lcov.info
              echo "coverage from combined export: $(echo ${CANDIDATES[@]} | tr ' ' '+')"
              EXPORT_SUCCESS=true
            fi
          fi

          # Fallback: iterate candidates one by one
          if [ "$EXPORT_SUCCESS" = false ]; then
            for candidate in "${CANDIDATES[@]}"; do
              if xcrun llvm-cov export -format=lcov -instr-profile "$PROFDATA" "$candidate" > "$TMP_LCOV" 2>/dev/null && [ -s "$TMP_LCOV" ] && grep -q "^SF:" "$TMP_LCOV"; then
                mv "$TMP_LCOV" build/reports/lcov.info
                echo "coverage from: $(basename $(dirname "$candidate"))/$(basename "$candidate")"
                EXPORT_SUCCESS=true
                break
              fi
            done
          fi

          if [ "$EXPORT_SUCCESS" = false ]; then
            echo "coverage export skipped: no candidate produced valid lcov output — tests are unaffected"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Filter by pattern if provided
          INCLUDE_PATTERN="${{ inputs.coverage-include-pattern }}"
          if [ -n "$INCLUDE_PATTERN" ]; then
            filter_lcov_by_pattern "$INCLUDE_PATTERN" build/reports/lcov.info build/reports/lcov.info.filtered
            mv build/reports/lcov.info.filtered build/reports/lcov.info
          fi

          echo "found=true" >> $GITHUB_OUTPUT
        } || {
          WARN_MSG="coverage export failed with error — tests are unaffected"
          echo "$WARN_MSG"
          echo "found=false" >> $GITHUB_OUTPUT
        }
        exit 0

    - name: Publish test results
      if: ${{ inputs.run-tests == 'true' }}
      uses: dorny/test-reporter@v3
      with:
        name: Swift Unit Tests
        path: ${{ inputs.working-directory }}/build/reports/junit/junit.xml
        reporter: java-junit

    - name: Set outputs
      id: set-outputs
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        TEST_RESULTS_PATH="${{ inputs.working-directory }}/build/reports/junit/junit.xml"
        echo "test-results-path=$TEST_RESULTS_PATH" >> $GITHUB_OUTPUT
        COVERAGE_PATH="${{ inputs.working-directory }}/build/reports/lcov.info"
        echo "coverage-path=$COVERAGE_PATH" >> $GITHUB_OUTPUT

    - name: Upload coverage artifact
      id: upload-coverage-artifact
      if: ${{ inputs.run-tests == 'true' && inputs.run-coverage == 'true' && steps.export-coverage.outputs.found == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.coverage-artifact-name }}
        path: ${{ inputs.working-directory }}/build/reports/lcov.info
        retention-days: 1

    - name: Upload artifact
      id: upload-artifact
      if: ${{ inputs.run-tests == 'true' && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/build/reports/junit
        retention-days: 1
