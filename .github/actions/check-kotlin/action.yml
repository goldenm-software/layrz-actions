name: 'Kotlin/Android Checks'
description: 'Run Kotlin linting (ktlint) and Gradle unit tests for Android'
author: 'Layrz'

inputs:
  working-directory:
    description: 'Directory containing the Gradle project'
    required: false
    default: '.'
  gradle-task:
    description: 'Gradle task to run for tests'
    required: false
    default: 'testDebugUnitTest'
  java-version:
    description: 'Java version to use (temurin distribution)'
    required: false
    default: '17'
  ktlint-version:
    description: 'Version of ktlint CLI to use'
    required: false
    default: '1.4.1'
  flutter-version:
    description: 'Flutter version to use; when non-empty, set up Flutter first'
    required: false
    default: ''
  flutter-directory:
    description: 'Directory to run flutter pub get in'
    required: false
    default: '.'
  run-lint:
    description: 'Whether to run ktlint linting'
    required: false
    default: 'true'
  run-tests:
    description: 'Whether to run Gradle tests'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Whether to upload test results artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for the test results artifact'
    required: false
    default: 'kotlin-test-results'
  test-results-path:
    description: 'Relative path to test results directory (from working-directory)'
    required: false
    default: 'build/test-results'
  coverage-path:
    description: 'Path to the JaCoCo XML report, relative to working-directory; empty disables coverage upload'
    required: false
    default: ''
  coverage-artifact-name:
    description: 'Name for the coverage artifact'
    required: false
    default: 'kotlin-coverage'

outputs:
  test-results-path:
    description: 'Path to the Gradle test results XML directory'
    value: ${{ steps.set-outputs.outputs.test-results-path }}
  coverage-path:
    description: 'Path to the JaCoCo XML coverage file'
    value: ${{ steps.set-outputs.outputs.coverage-path }}
  artifact-id:
    description: 'ID of the uploaded artifact'
    value: ${{ steps.upload-artifact.outputs.artifact-id }}
  artifact-url:
    description: 'URL of the uploaded artifact'
    value: ${{ steps.upload-artifact.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Flutter
      if: ${{ inputs.flutter-version != '' }}
      uses: flutter-actions/setup-flutter@v4
      with:
        channel: stable
        version: ${{ inputs.flutter-version }}
        cache: true
        cache-sdk: true

    - name: Run flutter pub get and materialize gradle wrapper
      if: ${{ inputs.flutter-version != '' }}
      shell: bash
      working-directory: ${{ inputs.flutter-directory }}
      run: flutter pub get && flutter build apk --config-only

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}
        cache: 'gradle'

    - name: Download ktlint CLI
      id: download-ktlint
      if: ${{ inputs.run-lint == 'true' }}
      shell: bash
      run: |
        KTLINT_VERSION="${{ inputs.ktlint-version }}"
        DOWNLOAD_URL="https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
        curl -sL "$DOWNLOAD_URL" -o "${{ runner.temp }}/ktlint"
        chmod +x "${{ runner.temp }}/ktlint"
        echo "ktlint-path=${{ runner.temp }}/ktlint" >> $GITHUB_OUTPUT

    - name: Run ktlint
      if: ${{ inputs.run-lint == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        "${{ steps.download-ktlint.outputs.ktlint-path }}" \
          "**/src/**/*.kt" \
          "!**/*.g.kt" \
          --reporter=plain

    - name: Run Gradle tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ ! -f ./gradlew ]; then
          echo "ERROR: gradlew not found in ${{ inputs.working-directory }}"
          echo "This typically happens when:"
          echo "  1. The project is a Flutter plugin/app where gradle wrapper files are gitignored"
          echo "  2. flutter-version input was not set to materialize the wrapper"
          echo ""
          echo "SOLUTION:"
          echo "  - Set flutter-version input to enable 'flutter build apk --config-only'"
          echo "  - OR commit the gradle wrapper files to the repository (gradlew, gradlew.bat, gradle-wrapper.jar)"
          exit 1
        fi
        ./gradlew ${{ inputs.gradle-task }}

    - name: Normalize artifact paths
      id: normalize-paths
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        set -e

        # Helper function to normalize a path
        normalize_path() {
          local path="$1"
          if command -v realpath &> /dev/null; then
            realpath --relative-to="$GITHUB_WORKSPACE" "$path" 2>/dev/null || python3 -c "import os.path,sys; print(os.path.relpath('$path', os.environ['GITHUB_WORKSPACE']))"
          else
            python3 -c "import os.path,sys; print(os.path.relpath('$path', os.environ['GITHUB_WORKSPACE']))"
          fi
        }

        # Normalize test results path
        TEST_RESULTS_FULL="${{ inputs.working-directory }}/${{ inputs.test-results-path }}"
        TEST_RESULTS_NORMALIZED=$(normalize_path "$TEST_RESULTS_FULL")
        echo "test-results-path=$TEST_RESULTS_NORMALIZED" >> $GITHUB_OUTPUT

        # Normalize coverage path if specified
        COVERAGE_PATH="${{ inputs.coverage-path }}"
        if [ -n "$COVERAGE_PATH" ]; then
          COVERAGE_FULL="${{ inputs.working-directory }}/$COVERAGE_PATH"
          COVERAGE_NORMALIZED=$(normalize_path "$COVERAGE_FULL")
          echo "coverage-path=$COVERAGE_NORMALIZED" >> $GITHUB_OUTPUT
        fi

    - name: Publish test results
      if: ${{ inputs.run-tests == 'true' }}
      uses: dorny/test-reporter@v3
      with:
        name: Kotlin Unit Tests
        path: ${{ steps.normalize-paths.outputs.test-results-path }}/**/*.xml
        reporter: java-junit

    - name: Upload coverage artifact
      id: upload-coverage
      if: ${{ inputs.run-tests == 'true' && inputs.coverage-path != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.coverage-artifact-name }}
        path: ${{ steps.normalize-paths.outputs.coverage-path }}
        retention-days: 1

    - name: Set outputs
      id: set-outputs
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        TEST_RESULTS_PATH="${{ steps.normalize-paths.outputs.test-results-path }}"
        echo "test-results-path=$TEST_RESULTS_PATH" >> $GITHUB_OUTPUT
        COVERAGE_PATH="${{ steps.normalize-paths.outputs.coverage-path }}"
        if [ -n "$COVERAGE_PATH" ]; then
          echo "coverage-path=$COVERAGE_PATH" >> $GITHUB_OUTPUT
        fi

    - name: Upload artifact
      id: upload-artifact
      if: ${{ inputs.run-tests == 'true' && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.normalize-paths.outputs.test-results-path }}
        retention-days: 1
