# Example: Using the Dart checks composite action
# Place this file in .github/workflows/ in your target repository

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-dart:  # ← This will be the check name!
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: goldenm-software/layrz-actions/.github/actions/check-dart@v1
        with:
          flutter-version: "3.38.8"
          run-tests: true

      # Upload coverage artifact (if needed for coverage report)
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 1
