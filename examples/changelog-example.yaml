# Example: Using the changelog composite action
# This can be used in PR workflows or release workflows

on:
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for changelog generation

      # Optional: Add custom steps before changelog
      - name: Custom validation
        run: echo "Running custom validation..."

      - uses: goldenm-software/layrz-actions/.github/actions/changelog@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          post-comment: true
          comment-header: "## 📋 Changelog Summary"
          exclude-types: "chore,style"
