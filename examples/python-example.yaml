# Example: Using the Python checks composite action
# Place this file in .github/workflows/ in your target repository

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-python:  # ← This will be the check name!
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: goldenm-software/layrz-actions/.github/actions/check-python@v1
        with:
          run-tests: true
          coverage-library: "mypackage"

      # Upload coverage artifact (if needed for coverage report)
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.json
          retention-days: 1
