# Example: Using the C++ checks composite action
# Place this file in .github/workflows/ in your target repository

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-cpp:  # ← This will be the check name!
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: goldenm-software/layrz-actions/.github/actions/check-cpp@v1
        with:
          working-directory: ./cpp
          build-type: Debug
          run-tests: true
          artifact-name: cpp-coverage
