# Example: Using the Go checks composite action
# Place this file in .github/workflows/ in your target repository

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-go:  # ← This will be the check name!
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: goldenm-software/layrz-actions/.github/actions/check-go@v1
        with:
          go-version: "1.25.5"
          run-tests: true

      # Upload coverage artifact (if needed for coverage report)
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.txt
          retention-days: 1
